services:
  postgres:
    image: postgres:16-alpine
    container_name: rapid-screening-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rapid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rapid}
      POSTGRES_DB: ${POSTGRES_DB:-rapid_screening}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rapid} -d ${POSTGRES_DB:-rapid_screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rapid-screening-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["backend"]
    image: golang:1.22-alpine
    container_name: rapid-screening-backend
    working_dir: /app
    restart: unless-stopped
    command: ["go", "run", "./cmd/server"]
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - .:/app
      - ./data:/data
    environment:
      PORT: ${PORT:-8080}
      DATA_FILE: /data/trackings.json
      CACHE_TTL_MINUTES: ${CACHE_TTL_MINUTES:-15}
      REFRESH_COOLDOWN_SECONDS: ${REFRESH_COOLDOWN_SECONDS:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      TRACK17_API_KEY: ${TRACK17_API_KEY:-}
      TRACKINGMORE_API_KEY: ${TRACKINGMORE_API_KEY:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-rapid}:${POSTGRES_PASSWORD:-rapid}@postgres:5432/${POSTGRES_DB:-rapid_screening}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
